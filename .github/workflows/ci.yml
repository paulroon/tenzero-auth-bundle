name: CI

on:
    push:
    pull_request:

jobs:
    tests:
        name: PHP ${{ matrix.php }}, SF ${{ matrix.symfony }} - ${{ matrix.deps }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: [ 8.3, 8.4 ]
                deps: [ highest ]
                symfony: [ 6.4.*, 7.0.*, 8.0.* ]
                exclude:
                    - php: 8.3
                      symfony: 8.0.*
                include:
                    - php: 8.4
                      deps: lowest
                      symfony: 6.4.*
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: flex

            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.deps }}
                  composer-options: --prefer-dist --no-audit
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}

            - name: Test
              run: vendor/bin/phpunit

    php-stan:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4

            - name: Install dependencies
              uses: ramsey/composer-install@v3

            - name: PHPStan
              run: vendor/bin/phpstan analyse

    php-cs-fixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4

            - name: Install dependencies
              uses: ramsey/composer-install@v3

            - name: PHP-CS-Fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff
